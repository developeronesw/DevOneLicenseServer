name: Deploy License Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devone-license-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate production Wrangler config
        env:
          D1_DATABASE_ID: ${{ secrets.DEVONE_LICENSE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          cp wrangler.example.jsonc wrangler.jsonc
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "wrangler.jsonc";
          const id = process.env.D1_DATABASE_ID;
          const text = fs.readFileSync(path, "utf8");
          fs.writeFileSync(path, text.replace("<D1_DATABASE_ID>", id));
          NODE

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply devone-license-db --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
